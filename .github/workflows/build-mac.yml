name: Build Maya Chamber (macOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S plugins/chamber-reverb -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Ad-hoc sign and make the DMG
        run: bash packaging/make-chamber-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: MayaChamber-macOS-dmg
          path: MayaChamber-macOS.dmg
          if-no-files-found: error
